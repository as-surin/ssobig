<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="frame">
      <div class="contant">
        <div class="view"><div class="div"></div></div>
        <div class="div-2">
          <img class="image" src="img/image-2.svg" />
          <div class="div-3">
            <div class="text-wrapper">ssobig 쏘빅</div>
            <p class="p">인터렉션과 소통, 게임화를 통해<br />사람들을 연결하는 플랫폼 쏘빅입니다.</p>
          </div>
        </div>
        <div class="div-4">
          <div class="div-5">
            <img class="line" src="img/line-1.svg" />
            <div class="text-wrapper-2">Brand</div>
            <img class="line" src="img/line-2.svg" />
          </div>
          <div class="div-6">
            <div class="view-2">
              <div class="view-3"></div>
              <div class="view-4">
                <div class="text-wrapper-3">Ssobig tool</div>
                <p class="text-wrapper-4">인터렉션 소통, 게임화 제작 툴</p>
                <div class="view-5">
                  <img class="img" src="img/image.svg" />
                  <div class="text-wrapper-5">about.ssobig.com</div>
                </div>
              </div>
            </div>
            <div class="view-2">
              <div class="view-6"></div>
              <div class="view-4">
                <div class="text-wrapper-3">러브버디즈</div>
                <p class="text-wrapper-4">매력있고 사람스러운 찐친 만드는 곳</p>
                <div class="view-5">
                  <div class="overlap-group-wrapper">
                    <div class="overlap-group">
                      <div class="group"><div class="ellipse"></div></div>
                      <div class="group-2"></div>
                      <div class="rectangle"></div>
                    </div>
                  </div>
                  <div class="text-wrapper-5">love___buddies</div>
                </div>
              </div>
            </div>
          </div>
          <div class="div-7">
            <div class="view-2">
              <div class="view-7"></div>
              <div class="view-4">
                <div class="text-wrapper-3">N.O.W.seoul 나우서울</div>
                <p class="text-wrapper-4">퇴근 후 만나는 전문직 비즈니스 네트워킹 모임</p>
                <div class="view-5">
                  <div class="overlap-group-wrapper">
                    <div class="overlap-group">
                      <div class="group"><div class="ellipse"></div></div>
                      <div class="group-2"></div>
                      <div class="rectangle"></div>
                    </div>
                  </div>
                  <div class="text-wrapper-5">n.o.w.seoul</div>
                </div>
              </div>
            </div>
            <div class="view-2">
              <div class="view-8"></div>
              <div class="view-4">
                <div class="text-wrapper-3">게임오브</div>
                <p class="text-wrapper-4">TV속 게임을 만들고 플레이하는 커뮤니티</p>
                <div class="view-5">
                  <div class="overlap-group-wrapper">
                    <div class="overlap-group">
                      <div class="group"><div class="ellipse"></div></div>
                      <div class="group-2"></div>
                      <div class="rectangle"></div>
                    </div>
                  </div>
                  <div class="text-wrapper-5">game_orb</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="div-8">
          <div class="div-5">
            <img class="line" src="img/line-1-2.svg" />
            <div class="text-wrapper-2">Community</div>
            <img class="line" src="img/line-2-2.svg" />
          </div>
          <div class="div-7">
            <div class="view-wrapper">
              <div class="view-9">
                <div class="text-wrapper-3">쏘빅 커뮤니티</div>
                <div class="text-wrapper-4">쏘빅 커뮤니티</div>
                <div class="view-5">
                  <img class="img" src="img/image.svg" />
                  <div class="text-wrapper-5">슬랙링크</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

</html>
